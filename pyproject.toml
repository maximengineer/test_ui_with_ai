[tool.poetry]
name = "ai-frontend-regression-tester"
version = "1.0.0"
description = "Production-ready front-end regression tester"
authors = ["Your Team <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.13"
aiofiles = "^24.1.0"
aiohttp = "^3.10.12"
beautifulsoup4 = "^4.12.3"
click = "^8.2.1"
crawl4ai = "^0.7.4"
loguru = "^0.7.3"
lxml = "^5.2.2"
opencv-python-headless = "^4.10.0.84"
pillow = "^10.4.0"
pydantic = "^2.11.7"
pydantic-settings = "^2.10.1"
pytz = "^2024.2"
pyyaml = "^6.0.2"
requests = "^2.32.5"
scikit-image = "^0.25.2"
typer = "^0.16.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
ruff = "^0.12.9"

[tool.poetry.scripts]
afr = "test_ui.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
